ota_reference: OTA-TEC-0035 §9 TAUGHT_BY
created: '2026-07-24'
curator: T.P.K.
notes: >
  Kein GPS auf dem Mond (kein Satellitennetz 2040 [H]).
  Inertialnavigation: Gyroskope + Beschleunigungssensoren, Drift-Problem bekannt [R].
  Sternennavigation: kein Atmosphaere -> Sterne immer sichtbar [R], Triangulation moeglich.
  Odometrie: Apollo-LRV hat Radumdrehungen gezaehlt [R].
  Horizont-Distanz Mond: ~6.7 km bei Augenhoehe 1.8 m (kleiner Radius) [R].
  Bakennavigation: Radiobaken von der Basis, Triangulation.
  Redundanz-Kombination aller Methoden fuer Sicherheit.
