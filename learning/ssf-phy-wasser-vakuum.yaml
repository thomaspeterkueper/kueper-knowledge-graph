notes: >
  Tripelpunkt H2O: 611.7 Pa / 0.01 Celsius [R].
  Mars-Atmosphaere ~600 Pa -> unterhalb Tripelpunkt -> kein fluessiges Wasser.
  Sublimation bei Eis-Erwaermung auf -20 bis 0 Celsius und 600 Pa [H, aus OTA-TEC-0034 §3].
  Kondensationsfalle -80 Celsius: Rekondensation zu Frost, dann aufschmelzen.
  Armstrong-Grenze: 6.3 kPa, ab hier siedet Blut [R].
