notes: >
  Mondstaub: extrem feinkoernig (<10 Mikrometer), scharfkantig [R].
  Kein Wasser-Transport der Kanten abrundet (kein Wasser, kein Wind) [R].
  Elektrostatische Aufladung durch Sonnenwind -> Staub klebt an Oberflaechen [R].
  Apollo-Erfahrung: Dichtungsversagen, Raumanzug kaum oeffenbar [R].
  Mesh-Wheel-Reifen: Drahtgeflecht statt Luftreifen, trotzdem Abrasionsproblem [R].
  Reinigungsansaetze: elektrische Felder (noch experimentell [H]).
  Solarzellen-Degradation durch Staubbelag: real messbar auf Mars (Opportunity) [R].
