name: Apply NOXIA unlock learning modules

on:
  push:
    branches:
      - task/noxia-unlock-learning-modules

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/noxia-unlock-learning-modules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic migration
        run: node scripts/apply-noxia-unlock-learning-modules.mjs
      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('exports/kxf-learning-modules-0.1.json','utf8'))"
      - name: Source-of-truth check
        run: python3 scripts/check_source_of_truth.py
      - name: Learning check
        run: npm run learning:check
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- exports/kxf-learning-modules-0.1.json external-tasks/open/EXT-SSF-KG-20260829-noxia-unlock-learning-module-identities.md external-tasks/done/EXT-SSF-KG-20260829-noxia-unlock-learning-module-identities.md
          git commit -m "feat: export canonical NOXIA unlock learning modules"
          git push origin HEAD:task/noxia-unlock-learning-modules
