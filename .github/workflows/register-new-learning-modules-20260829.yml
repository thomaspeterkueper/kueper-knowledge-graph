name: Register new learning modules 20260829

on:
  push:
    branches:
      - fix/register-new-learning-modules-20260829

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/register-new-learning-modules-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Register canonical modules
        run: python3 scripts/register-new-learning-modules-20260829.py
      - name: Validate JSON
        run: python3 -m json.tool exports/kxf-learning-modules-0.1.json >/dev/null
      - name: Source-of-Truth check
        run: python3 scripts/check_source_of_truth.py
      - name: Commit generated export
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/kxf-learning-modules-0.1.json
          git commit -m "fix: register five new SSF learning modules in KXF"
          git push origin HEAD:fix/register-new-learning-modules-20260829
