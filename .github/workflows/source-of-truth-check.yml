name: Source-of-Truth-Prüfung (ECO-ARC-0019)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install pyyaml

      - name: Source-of-Truth prüfen
        run: python3 scripts/check_source_of_truth.py
