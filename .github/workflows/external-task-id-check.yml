name: External Task ID Check

on:
  push:
    paths:
      - 'external-tasks/**'
      - 'scripts/validate-external-task-ids.py'
      - '.github/workflows/external-task-id-check.yml'
  pull_request:
    paths:
      - 'external-tasks/**'
      - 'scripts/validate-external-task-ids.py'
      - '.github/workflows/external-task-id-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate external task IDs
        run: python scripts/validate-external-task-ids.py
