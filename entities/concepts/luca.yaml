  - CON:L0:veraenderung
beschreibung: >
  Letzter universeller gemeinsamer Vorfahr des heutigen irdischen Lebens.
  Für den hier referenzierten Forschungsstand ist insbesondere die
  Rekonstruktion eines noch unvollständigen enzymatischen Stoffwechsels
  relevant, dessen weitere Ausgestaltung in den zu Bakterien und Archaea
  führenden Linien unabhängig erfolgte.
quelle:
  autoren: "Mrnjavac, N.; Hoffmann, N.K.; Schlikker, M.L. et al."
  titel: "Intermediate stages in the origin of metabolism at a phosphorylating hydrothermal vent"
  journal: "Science Advances"
  jahr: 2026
  artikel: eaef3128
  doi: "10.1126/sciadv.aef3128"
befund: >
  Native Übergangsmetalle werden als katalytische Vorläufer von Enzymen und
  Kofaktoren am Ursprung des Stoffwechsels rekonstruiert. Phosphit ermöglicht
  in den untersuchten Reaktionen unter Nutzung nativer Metallkatalysatoren
  Phosphorylierungen in Wasser. Serpentinisierende hydrothermale Systeme
  werden als energielieferndes und katalytisches Milieu für frühe
  Stoffwechselentwicklung vorgeschlagen.
