entity_id: CON:L1:autonomiegradient
typ: Concept
layer: L1
name: Autonomiegradient
domäne: MET
status: '[T]'
derived_from:
  - CON:L0:leben
  - CON:L0:struktur
  - CON:L0:veraenderung
beschreibung: >
  Maß für den Grad, in dem ein System die für Erhalt und Fortführung seiner
  Organisation erforderlichen Funktionen und deren Ermöglichungsbedingungen
  durch seine eigene Organisation erzeugt, reguliert, erneuert oder gegen
  Umweltvariation stabilisiert. Autonomie bezeichnet dabei organisatorische
  Schließung unter fortgesetzter materieller und energetischer Offenheit.
struktur:
  ermoeglichung: >
    Die Umgebung stellt eine für die Organisation relevante Funktion wie
    Katalyse, Energie oder Struktur unmittelbar bereit.
  substitution: >
    Das System realisiert einzelne zuvor extern bereitgestellte Funktionen
    durch eigene Komponenten.
  schliessung: >
    Die Organisation produziert und erneuert Komponenten, durch die ihre
    eigene funktionale Fortsetzung ermöglicht wird.
perspektive: >
  Potenziell operationalisierbar über Substitution, Reproduktion, Regulation
  und katalytische beziehungsweise operative Schließung systemnotwendiger
  Funktionen.
erstellt: '2026-08-11'
kurator: T.P.K.
